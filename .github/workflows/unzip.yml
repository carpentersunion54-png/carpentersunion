name: Extract Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v6

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o "النقابة العامة للنجارة وقطع الزجاج.zip" -d extracted

      - name: Copy website files
        run: |
          cp -R extracted/* .
          rm -rf extracted

      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract website files" || echo "No changes to commit"
          git push
